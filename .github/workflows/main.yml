name: CI

on:
  - push
  - pull_request

permissions:
  contents: read

jobs:
  rspec:
    runs-on: ${{ matrix.os }}
    name: Ruby ${{ matrix.ruby }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          # NOTE: hold off testing other platforms until we start having native dependencies or running into issues on them
          # - macos-latest
          # - windows-latest
        ruby:
          - "4.0"
          - "3.4"
          - "head"
    continue-on-error: ${{ matrix.ruby == 'head' }}
    env:
      BUNDLE_GEMFILE: Gemfile

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@984c0c890880bbf811283d6f09c4607c62d210a4 # v1.323.0
        with:
          ruby-version: ${{ matrix.ruby }}
      - run: bundle install
      - name: RSpec
        run: bundle exec rspec
      - name: Upload coverage to Codecov
        if: ${{ strategy.job-index == 0 }} # only run codecov on first run
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true
          file: coverage/coverage.xml
  standard:
    name: Standard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@984c0c890880bbf811283d6f09c4607c62d210a4 # v1.323.0
        with:
          ruby-version: "4.0.7"
      - run: bundle install
      - name: Standard
        run: bundle exec rake standard
  cucumber:
    runs-on: ubuntu-latest
    name: Gherkin Conformance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - uses: ruby/setup-ruby@984c0c890880bbf811283d6f09c4607c62d210a4 # v1.323.0
        with:
          ruby-version: "4.0.7"
      - run: bundle install
      - name: Cucumber
        run: bundle exec cucumber
  steep:
    runs-on: ubuntu-latest
    name: Type Check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@984c0c890880bbf811283d6f09c4607c62d210a4 # v1.323.0
        with:
          ruby-version: "4.0.7"
      - run: bundle install
      - run: bundle exec rbs collection install
      - run: bundle exec steep check
  security:
    runs-on: ubuntu-latest
    name: Security Audit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@984c0c890880bbf811283d6f09c4607c62d210a4 # v1.323.0
        with:
          ruby-version: "4.0.7"
      - name: Bundle Audit
        run: bundle lock && gem install bundler-audit && bundle-audit check --update
  # check the status of other jobs, so we can have a single job dependency for branch protection
  # https://github.com/community/community/discussions/4324#discussioncomment-3477871
  status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [rspec, standard, cucumber, security, steep]
    if: always()
    steps:
      - name: Successful CI
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: exit 0
      - name: Failing CI
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1
