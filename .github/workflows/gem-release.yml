on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.6.5)"
        required: true
        type: string

name: Publish Gem

permissions:
  contents: read
  id-token: write

jobs:
  gem-release:
    runs-on: ubuntu-latest
    environment: publish
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: ruby/setup-ruby@78c62f2208e480ce3d5ae4dfd9b9e181acf48b63 # v1.344.0
      - run: bundle install

      - name: Build Gem
        run: |
          mapfile -t gemspecs < <(find . -maxdepth 1 -type f -name '*.gemspec' -printf '%f\n' | sort)
          if [ "${#gemspecs[@]}" -ne 1 ]; then
            echo "Expected exactly one gemspec in the repository root, found ${#gemspecs[@]}: ${gemspecs[*]}" >&2
            exit 1
          fi
          gem build "${gemspecs[0]}"

      - name: Push Gem
        uses: rubygems/release-gem@2654a0fe0dc39725c07fe84d7fe863a084f2424e # v1.5.0
