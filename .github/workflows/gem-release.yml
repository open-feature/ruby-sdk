on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.6.5)"
        required: true
        type: string

name: Publish Gem

permissions:
  contents: read
  id-token: write

jobs:
  gem-release:
    runs-on: ubuntu-latest
    environment: publish
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: ruby/setup-ruby@20eb24b0d509e2b9ed9b6d42ddfeb992915e0564 # v1.341.0
      - run: bundle install

      - name: Build Gem
        run: |
          mapfile -t gemspecs < <(find . -maxdepth 1 -type f -name '*.gemspec' -printf '%f\n' | sort)
          if [ "${#gemspecs[@]}" -ne 1 ]; then
            echo "Expected exactly one gemspec in the repository root, found ${#gemspecs[@]}: ${gemspecs[*]}" >&2
            exit 1
          fi
          gem build "${gemspecs[0]}"

      - name: Push Gem
        uses: rubygems/release-gem@5c53f5308233b7c0f47411f0471b3faae6fa57b2 # v1.4.2
